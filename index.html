<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .mensaje {
            position: absolute;
            top: 15%;
            text-align: center;
            z-index: 100;
            color: #d4a017;
            pointer-events: none;
        }

        .flower-container {
            position: absolute;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom;
        }

        .stem {
            width: 6px;
            height: 0;
            background-color: #4b6f44;
            border-radius: 3px;
            animation: growStem 3s ease-out forwards;
        }

        @keyframes growStem {
            from { height: 0; }
            to { height: 180px; }
        }

        .flower-head {
            font-size: 0px;
            transform: scale(0);
            animation: bloom 2s ease-out 2.5s forwards;
            user-select: none;
        }

        @keyframes bloom {
            0% { transform: scale(0); font-size: 0px; }
            60% { transform: scale(1.2); font-size: 60px; }
            100% { transform: scale(1); font-size: 50px; }
        }

        .secreto {
            font-size: 1px;
            color: #ffffff;
            position: absolute;
            bottom: 5px;
            right: 5px;
        }
    </style>
</head>
<body>

    <div class="mensaje">
        <h1>Un jardín para ti mi Anita Bella</h1>
    </div>

    <p class="secreto">Cesar sabe</p>

    <script>
        function createFlower() {
            const container = document.createElement('div');
            container.className = 'flower-container';
            
            const xPos = Math.random() * 95;
            container.style.left = xPos + 'vw';
            
            const flowerEmojis = ['🌻', '☀️', '⭐'];
            const head = document.createElement('div');
            head.className = 'flower-head';
            head.innerText = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];

            const stem = document.createElement('div');
            stem.className = 'stem';

            container.appendChild(head);
            container.appendChild(stem);
            document.body.appendChild(container);

            setTimeout(() => {
                container.remove();
            }, 60000);
        }

        setInterval(createFlower, 600);
    </script>
</body>
</html>
